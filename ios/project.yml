name: Tipoff
options:
  bundleIdPrefix: com.tipoff
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 38LHN9PGZP  # change to your team in Xcode → Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
targets:
  Tipoff:
    type: application
    platform: iOS
    sources:
      - path: Tipoff
      - path: ../server/ml/forecaster.json   # the trained model, shared with the web app
        buildPhase: resources
      - path: ../server/ml/sports            # in-game models (soccer, football, basketball)
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryanzhao.tipoff
        PRODUCT_NAME: Tipoff
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Tipoff/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tipoff
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.bryanzhao.tipoff.refresh
  TipoffUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TipoffUITests
    dependencies:
      - target: Tipoff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryanzhao.tipoff.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tipoff
schemes:
  Tipoff:
    build:
      targets:
        Tipoff: all
    test:
      targets:
        - TipoffUITests
    run:
      config: Debug
