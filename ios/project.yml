name: Oddshot
options:
  bundleIdPrefix: com.oddshot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 38LHN9PGZP  # change to your team in Xcode → Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
targets:
  Oddshot:
    type: application
    platform: iOS
    sources:
      - path: Oddshot
      - path: ../server/ml/forecaster.json   # the trained model, shared with the web app
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryanzhao.oddshot
        PRODUCT_NAME: Oddshot
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Oddshot/Resources/Info.plist
      properties:
        CFBundleDisplayName: Oddshot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.oddshot.app.refresh
  OddshotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OddshotUITests
    dependencies:
      - target: Oddshot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryanzhao.oddshot.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Oddshot
schemes:
  Oddshot:
    build:
      targets:
        Oddshot: all
    test:
      targets:
        - OddshotUITests
    run:
      config: Debug
